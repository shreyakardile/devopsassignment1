---
- name: Install Nginx
  ansible.builtin.apt:
    name: nginx
    state: present
    update_cache: true
- name: Deploy Nginx reverse proxy configuration
  ansible.builtin.template:
    src: student-record.conf.j2
    dest: /etc/nginx/sites-available/student-record
    owner: root
    group: root
    mode: "0644"
  notify: Validate and reload Nginx
- name: Enable Student Record reverse proxy site
  ansible.builtin.file:
    src: /etc/nginx/sites-available/student-record
    dest: /etc/nginx/sites-enabled/student-record
    state: link
  notify: Validate and reload Nginx
- name: Remove default Nginx site
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: Validate and reload Nginx
- name: Ensure Nginx is enabled and started
  ansible.builtin.service:
    name: nginx
    state: started
    enabled: true
